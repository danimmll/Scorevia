logging:
  file:
    name: /logs/eureka-server.log
  level:
    root: INFO
    # El nivel del propio paquete, por variable y con INFO por defecto (igual que el
    # Gateway). Estaba en DEBUG a fuego: con el LoggingAspect trazando cada metodo, eso
    # convertia el log en 16 GB diarios en un servicio que no atendia a nadie. Para volver
    # a verlo todo: EUREKA_LOG_LEVEL=DEBUG.
    '[eurekaserver]': "${EUREKA_LOG_LEVEL:INFO}"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      file-name-pattern: /logs/eureka-server-%d{yyyy-MM-dd}.%i.log

server:
  port: 8761

spring:
  application:
    name: eureka-server
  security:
    user:
      name: "${EUREKA_USERNAME:eureka}"
      password: "${EUREKA_PASSWORD:eureka}"

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    # register-with-eureka/fetch-registry en false solo desactivan el registro del propio
    # Eureka Server como cliente; la replicación entre peers (PeerEurekaNodes) sigue usando
    # esta URL para resolverse a sí mismo -- "Adding new peer nodes [http://localhost:8761/eureka/]"
    # en los logs -- y como spring.security.user está activo, esa llamada de replicación sin
    # credenciales devuelve 401 en bucle (cada pocos segundos, vía ReplicationTaskProcessor).
    service-url:
      defaultZone: "http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka}@localhost:${server.port}/eureka/"
  instance:
    hostname: "${EUREKA_INSTANCE_HOSTNAME:eureka-server}"
  server:
    # Entorno de un solo nodo Eureka: el umbral de auto-preservación (85% de renovaciones
    # esperadas) se dispara fácilmente si varios de los pocos microservicios registrados
    # se reinician a la vez (despliegue, restart de docker-compose), y mientras está activo
    # Eureka deja de expirar instancias muertas del registro. Si algún día hay varias
    # instancias de Eureka en producción, revisar y probablemente reactivarlo.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
