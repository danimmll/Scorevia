name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - EurekaServer
          - Gateway
          - Microservicio-usuarios-roles
          - Microservicio-incidencias
          - Microservicio-estadisticas
          - Microservicio-predicciones
    defaults:
      run:
        working-directory: scorevia-backend/${{ matrix.service }}
    env:
      # Solo para los tests: los filtros JWT exigen la variable y no tienen valor por defecto.
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz-0123456789
      INCIDENCIAS_INTERNAL_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: scorevia-backend/${{ matrix.service }}/pom.xml
      - name: Compilar y pasar los tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp test 2>&1 | tee build.log
      - name: Resumen de errores
        if: failure()
        shell: bash
        run: |
          grep -E "\[ERROR\]" build.log | grep -v "^\[ERROR\] *$" | head -20 | while IFS= read -r linea; do
            echo "::error::${linea}"
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scorevia-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scorevia-frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npx ng test --watch=false
