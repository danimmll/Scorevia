<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="var(--sv-accent)" stroke-width="1.6"/>
        <path d="M12 6L15.5 8.6L14.2 12.7H9.8L8.5 8.6L12 6Z" stroke="var(--sv-accent)" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M12 2V6M12 22V18M2 12H6M22 12H18" stroke="var(--sv-accent)" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span>ScoreVia</span>
    </div>

    <h2>{{ 'reset_password' | transloco }}</h2>
    <p class="sub">{{ 'we_sent_a_6_digit_code_to_your_email' | transloco }}</p>

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    @if (successMessage) {
      <div style="background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <p style="font-weight: 600; margin: 0;">{{ 'done' | transloco }}</p>
        <p style="font-size: 0.9rem; margin-top: 5px;">{{ successMessage }}</p>
      </div>
    } @else {
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">{{ 'email_address' | transloco }}</label>
          <input type="email" id="email" formControlName="email" [placeholder]="'you_email_com' | transloco">
        </div>

        <button type="submit" class="btn-submit" [disabled]="forgotForm.invalid || isLoading">
          {{ (isLoading ? 'sending' : 'send_code') | transloco }}
        </button>
      </form>
    }

    <div class="footer-link">
      <a routerLink="/login">{{ 'back_to_log_in' | transloco }}</a>
    </div>
  </div>
</div>
