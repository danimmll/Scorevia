<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="var(--sv-accent)" stroke-width="1.6"/>
        <path d="M12 6L15.5 8.6L14.2 12.7H9.8L8.5 8.6L12 6Z" stroke="var(--sv-accent)" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M12 2V6M12 22V18M2 12H6M22 12H18" stroke="var(--sv-accent)" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span>ScoreVia</span>
    </div>

    <h2>{{ 'create_an_account' | transloco }}</h2>
    <p class="sub">{{ 'join_the_stats_platform' | transloco }}</p>

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <form [formGroup]="registerForm" (ngSubmit)="register()">
      <div class="form-group">
        <label for="nickname">Nickname</label>
        <input type="text" id="nickname" formControlName="nickname" [placeholder]="'your_public_name_3_20_characters' | transloco">
      </div>

      <div class="form-group">
        <label for="nombre">{{ 'name' | transloco }}</label>
        <input type="text" id="nombre" formControlName="nombre" [placeholder]="'e_g_daniel' | transloco">
      </div>

      <div class="form-group">
        <label for="apellido">{{ 'surname' | transloco }}</label>
        <input type="text" id="apellido" formControlName="apellido" [placeholder]="'e_g_martin' | transloco">
      </div>

      <div class="form-group">
        <label for="email">{{ 'email_address' | transloco }}</label>
        <input type="email" id="email" formControlName="email" [placeholder]="'you_email_com' | transloco">
      </div>
      
      <div class="form-group">
        <label for="password">{{ 'password' | transloco }}</label>
        <input type="password" id="password" formControlName="password" [placeholder]="'at_least_8_characters_and_one_special_charac' | transloco">
      </div>

      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid">{{ 'sign_up' | transloco }}</button>
    </form>

    <div class="divider">{{ 'or_sign_up_with' | transloco }}</div>

    <button class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      {{ 'sign_up_with_google' | transloco }}
    </button>

    <div class="footer-link">
      {{ 'already_have_an_account' | transloco }} <a routerLink="/login">{{ 'log_in' | transloco }}</a>
    </div>
  </div>
</div>
