# Configuración de sonar-scanner para el frontend Angular. A diferencia de los 7 módulos
# del backend (proyectos Maven, analizados con el plugin sonar-maven-plugin y sus propiedades
# en cada pom.xml), este no es un proyecto Maven -- necesita su propio sonar-scanner
# standalone (ver Dockerfile.jenkins-agent) y su configuración vive acá en vez de en un pom.

sonar.projectKey=scorevia-frontend
sonar.projectName=Scorevia Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

sonar.exclusions=**/*.spec.ts,src/environments/**,public/**
# Igual que sonar.coverage.exclusions en los pom.xml del backend: modelos/tipos puros,
# bootstrap de la app y configuración no aportan nada a medir por cobertura de tests.
sonar.coverage.exclusions=**/*.spec.ts,src/environments/**,src/main.ts,src/main.server.ts,src/server.ts,**/*.model.ts,**/app.routes*.ts,**/app.config*.ts

# Generado por `ng test --coverage --coverage-reporters=lcov` (ver stage "Test Frontend"
# del Jenkinsfile) -- ruta relativa a este archivo, es decir a scorevia-frontend/.
sonar.javascript.lcov.reportPaths=coverage/scorevia-frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/scorevia-frontend/lcov.info
